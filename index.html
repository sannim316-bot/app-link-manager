<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>App Link Manager</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand">↗ <strong>Link Manager</strong></div><span>One place for all your apps</span><button id="logout" hidden>Sign out</button></header>
<main><section id="login"><p class="eyebrow">ADMIN ACCESS</p><h1>Your apps.<br>Your links.</h1><p class="muted">Update destinations without rebuilding every app.</p><form id="loginForm"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button class="primary">Sign in</button></form></section>
<section id="workspace" hidden><div class="title"><div><p class="eyebrow">APP DIRECTORY</p><h1>Manage your links</h1></div><button id="newApp">+ Add app</button></div><div class="layout"><aside><label>Select an app<select id="apps"></select></label><button id="reload">Refresh saved links</button><p class="muted">Changes appear on connected apps after their next successful refresh.</p></aside><form id="editor"><h2 id="appTitle"></h2><p id="updated" class="muted"></p><div id="fields"></div><div class="actions"><button class="primary" id="save">Save changes</button><a id="preview" target="_blank" rel="noopener">View public settings ↗</a></div></form></div></section>
<p id="message" role="status" aria-live="polite"></p></main><script type="module" src="dashboard.js"></script></body></html>
